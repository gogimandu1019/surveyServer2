<!DOCTYPE html PUBLIC "-//W3C//DTD XHTML 1.0 Transitional//EN" "http://www.w3.org/TR/xhtml1/DTD/xhtml1-transitional.dtd">
<html>
<head>
<meta http-equiv="Content-Type" content="text/html; charset=utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>설문 관리</title>
<link rel="stylesheet" type="text/css" href="/style.css" />
</head>
<body onload="getList()">
<main class="wide">
  <table width="100%" class="card" cellpadding="0" cellspacing="0" border="0">
    <tr>
      <td><h1>설문 관리</h1><p class="desc small">이 화면은 이 노트북에서만 열립니다.</p></td>
      <td align="right"><a class="btn primary" href="/admin_edit.html">＋ 새 설문</a></td>
    </tr>
  </table>
  <div id="list"></div>
</main>
<script type="text/javascript">
var gList = [];
var gLocal = "";
var gLan = null;
var i, j, k;   // 전역 루프변수

// 목록 조회 + 그리기
function getList() {
	var xhr = new XMLHttpRequest();
	xhr.open("GET", "/api/adminList?t=" + new Date().getTime(), true);
	xhr.onreadystatechange = function() {
		if (xhr.readyState == 4) {
			if (xhr.status == 200) {
				var res = eval("(" + xhr.responseText + ")");
				gList = res.data;
				gLocal = res.localBase;
				gLan = res.lanBase;
				var html = "";
				if (gList.length == 0) {
					html = "<div class='card notice muted'>아직 설문이 없습니다. ＋ 새 설문을 눌러 만들어 보세요.</div>";
				}
				for (i = 0; i < gList.length; i++) {
					var s = gList[i];
					var base = gLan;
					if (base == null) base = gLocal;
					var t = String(s.title).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
					html += "<div class='card'>";
					html += "<table width='100%' cellpadding='0' cellspacing='0' border='0'><tr><td valign='top'>";
					html += "<h2 style='margin:0'>" + t + " ";
					if (s.open == 1) html += "<span class='badge open'>응답 받는 중</span>";
					else html += "<span class='badge'>마감</span>";
					html += "</h2><div class='muted small'>응답 " + s.cnt + "명 · 문항 " + s.q.length + "개 · 코드 " + s.code + "</div></td>";
					// open==1 이면 마감버튼
					if (s.open == 1) html += "<td align='right' valign='top'><button class='btn' onclick=\"doCmd('close', " + s.id + ")\">마감하기</button></td>";
					else html += "<td align='right' valign='top'><button class='btn primary' onclick=\"doCmd('open', " + s.id + ")\">응답 받기</button></td>";
					html += "</tr></table>";
					html += "<table width='100%' style='margin:14px 0;font-size:13px' cellpadding='3'>";
					html += "<tr><td width='72' class='muted'>응답 주소</td><td><code>" + base + "/survey.html?code=" + s.code + "</code></td><td width='60'><button class='btn' onclick=\"prompt('주소를 복사하세요 (Ctrl+C)', '" + base + "/survey.html?code=" + s.code + "')\">복사</button></td></tr>";
					html += "<tr><td width='72' class='muted'>결과 주소</td><td><code>" + base + "/result.html?code=" + s.code + "</code></td><td width='60'><button class='btn' onclick=\"prompt('주소를 복사하세요 (Ctrl+C)', '" + base + "/result.html?code=" + s.code + "')\">복사</button></td></tr>";
					html += "</table>";
					html += "<div class='actions'>";
					if (s.cnt > 0) html += "<a class='btn' href='/admin_edit.html?id=" + s.id + "'>제목 수정</a>";
					else html += "<a class='btn' href='/admin_edit.html?id=" + s.id + "'>수정</a>";
					html += "<a class='btn' href='/survey.html?code=" + s.code + "' target='_blank'>미리 보기</a>";
					html += "<a class='btn' href='/result.html?code=" + s.code + "' target='_blank'>결과</a>";
					html += "<button class='btn' onclick=\"doCmd('copy', " + s.id + ")\">복사해서 새 설문</button>";
					if (s.cnt > 0) html += "<button class='btn danger' onclick=\"if(confirm('응답을 모두 지울까요? 되돌릴 수 없습니다.'))doCmd('reset', " + s.id + ")\">응답 초기화</button>";
					else html += "<button class='btn danger' disabled>응답 초기화</button>";
					html += "<button class='btn danger' onclick=\"if(confirm('설문과 응답을 모두 삭제할까요? 되돌릴 수 없습니다.'))doCmd('delete', " + s.id + ")\">삭제</button>";
					html += "</div></div>";
				}
				if (gLan == null) {
					html += "<p class='muted small' style='text-align:center'>지금은 이 노트북에서만 응답할 수 있습니다. 와이파이로 공유하려면 HOST=0.0.0.0 으로 서버를 실행하세요.</p>";
				}
				document.getElementById("list").innerHTML = html;
			} else {
				alert("권한이 없습니다 (" + xhr.status + ")");
			}
		}
	}
	xhr.send(null);
}

// 명령 실행 (open/close/copy/reset/delete)
function doCmd(cmd, id) {
	var xhr = new XMLHttpRequest();
	xhr.open("POST", "/api/adminProc", true);
	xhr.setRequestHeader("Content-Type", "application/json");
	xhr.setRequestHeader("X-Requested-With", "XMLHttpRequest");
	xhr.onreadystatechange = function() {
		if (xhr.readyState == 4) {
			if (xhr.status == 200) {
				var res = eval("(" + xhr.responseText + ")");
				if (res.result == "OK") {
					if (cmd == "copy") alert("복사본을 만들었습니다 (마감 상태)");
					getList();
				} else {
					alert(res.msg);
				}
			} else {
				alert("에러 : " + xhr.status);
			}
		}
	}
	xhr.send(JSON.stringify({"cmd": cmd, "id": id}));
}
</script>
</body>
</html>
